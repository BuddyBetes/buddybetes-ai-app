
# netlify.toml
# Configuration for deploying to Netlify

[build]
  # Directory with the production-ready files
  publish = "dist"
  # Build command
  command = "npm run build"

# Redirects for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers to set
[[headers]]
  # Define headers for all files
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
# Specific cache control for assets to prevent caching
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
[[headers]]
  for = "/*.gif"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    
# Environment variable configuration
[build.environment]
  NODE_VERSION = "18"

# These settings will optimize your site build in production
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.images]
  compress = true
